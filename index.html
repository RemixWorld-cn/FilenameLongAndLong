<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FilenameLongAndLong - 世界上最长的文件扩展名</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e;
    --card: #161b22; --border: #30363d; --accent: #58a6ff;
    --accent-hover: #79c0ff; --danger: #f85149; --success: #3fb950;
    --warning: #d29922; --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f8fa; --fg: #1f2328; --muted: #656d76;
      --card: #fff; --border: #d0d7de; --accent: #0969da;
      --accent-hover: #0969da; --danger: #cf222e; --success: #2da44e; --warning: #9a6700; }
  }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; line-height: 1.6; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
  header { text-align: center; margin-bottom: 28px; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 700; letter-spacing: -0.02em; }
  .subtitle { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }
  .ext-display { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 16px; overflow-x: auto; font-family: ui-monospace, monospace; font-size: 0.75rem; line-height: 1.5; word-break: break-all; cursor: copy; }
  .section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .section h2 { font-size: 1.1rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .section h2::before { content: ""; width: 4px; height: 18px; background: var(--accent); border-radius: 2px; }
  .btn { background: var(--accent); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; transition: background 0.15s, transform 0.05s; }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.98); }
  .btn.secondary { background: var(--border); color: var(--fg); }
  .btn.secondary:hover { background: #3d444d; }
  .btn.danger { background: var(--danger); }
  .btn.danger:hover { background: #ff7b72; }
  .btn.success { background: var(--success); }
  .btn.success:hover { background: #56d364; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .file-input { display: none; }
  .drop-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 32px; text-align: center; color: var(--muted); transition: border-color 0.15s, background 0.15s; cursor: pointer; }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: rgba(88, 166, 255, 0.08); color: var(--accent); }
  .drop-zone.drag-over { transform: scale(1.01); }
  .file-list { margin-top: 16px; }
  .file-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .file-icon { font-size: 1.5rem; }
  .file-info { flex: 1; min-width: 180px; }
  .file-name { font-weight: 600; word-break: break-all; }
  .file-meta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .file-detected { font-size: 0.75rem; color: var(--accent); background: rgba(88,166,255,0.15); padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 4px; font-family: monospace; }
  .file-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .preview-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .preview-modal.open { display: flex; }
  .preview-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); max-width: 90vw; max-height: 85vh; width: 100%; overflow: hidden; display: flex; flex-direction: column; }
  .preview-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
  .preview-title { font-weight: 600; word-break: break-all; }
  .preview-detected { font-size: 0.75rem; color: var(--success); background: rgba(63,185,80,0.15); padding: 4px 10px; border-radius: 4px; font-family: monospace; display: flex; align-items: center; gap: 6px; }
  .preview-close { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; line-height: 1; padding: 4px; }
  .preview-close:hover { color: var(--fg); }
  .preview-content { flex: 1; overflow: auto; padding: 16px; }
  .preview-content img { max-width: 100%; max-height: 70vh; display: block; margin: 0 auto; }
  .preview-content video, .preview-content audio { width: 100%; max-height: 70vh; }
  .preview-content pre { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, monospace; font-size: 0.85rem; line-height: 1.6; background: var(--bg); padding: 12px; border-radius: 6px; border: 1px solid var(--border); overflow-x: auto; max-height: 70vh; }
  .preview-content .hex { font-family: ui-monospace, monospace; font-size: 0.75rem; line-height: 1.7; }
  .preview-content .hex-line { display: flex; gap: 8px; }
  .preview-content .hex-addr { color: var(--muted); min-width: 60px; }
  .preview-content .hex-bytes { flex: 1; }
  .preview-content .hex-ascii { color: var(--muted); font-family: ui-monospace, monospace; min-width: 48px; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--card); border: 1px solid var(--border); padding: 12px 20px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); transform: translateY(100px); opacity: 0; transition: 0.2s; z-index: 2000; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }
  .toast.warning { border-color: var(--warning); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; text-align: center; }
  .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .ext-tag { display: inline-block; background: rgba(88,166,255,0.15); color: var(--accent); padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-family: monospace; margin: 2px; }
  .tab-bar { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 4px; flex-wrap: wrap; }
  .tab { padding: 8px 14px; background: none; border: none; color: var(--muted); cursor: pointer; border-radius: 6px 6px 0 0; font-size: 0.85rem; transition: 0.15s; }
  .tab.active { color: var(--accent); background: rgba(88,166,255,0.1); border-bottom: 2px solid var(--accent); }
  .tab:hover:not(.active) { color: var(--fg); background: var(--bg); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fade 0.15s; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .builder-form { display: grid; gap: 12px; }
  .builder-form label { display: grid; gap: 6px; font-size: 0.9rem; }
  .builder-form input, .builder-form textarea, .builder-form select { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; color: var(--fg); font-family: inherit; }
  .builder-form textarea { min-height: 120px; font-family: ui-monospace, monospace; font-size: 0.85rem; }
  .checksums { display: grid; gap: 8px; font-family: ui-monospace, monospace; font-size: 0.8rem; }
  .checksum-item { display: flex; justify-content: space-between; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .checksum-item code { word-break: break-all; }
  .rename-section { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 16px; }
  .rename-section h3 { margin-bottom: 12px; font-size: 1rem; }
  .long-ext-preview { font-family: ui-monospace, monospace; font-size: 0.7rem; color: var(--muted); word-break: break-all; background: var(--card); padding: 8px; border-radius: 4px; border: 1px solid var(--border); margin: 8px 0; }
  @media (max-width: 520px) {
    .wrap { padding: 16px 12px; }
    .section { padding: 16px; }
    .file-item { flex-direction: column; align-items: flex-start; }
    .file-actions { width: 100%; justify-content: flex-start; }
    .preview-header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>

<div class="wrap">
  <header>
    <h1>📁 FilenameLongAndLong</h1>
    <p class="subtitle">世界上最长的文件扩展名 · 文件写入/预览/工具箱/重命名</p>

  <div class="section">

      <button class="tab" data-tab="template">模板生成</button>
    </div>
    <div class="tab-panel active" id="panel-text">

这是一个测试文件。
支持多行文本。</textarea></label>

          </select>
        </label>
        <div class="btn-row">
          <button class="btn" id="btnDownloadText">📥 下载文件</button>
          <button class="btn secondary" id="btnPreviewText">👁 预览</button>
          <button class="btn secondary" id="btnClearText">清空</button>
        </div>
      </div>
    </div>
    <div class="tab-panel" id="panel-binary">
      <div class="builder-form">
        <label>文件名 <input type="text" id="binFilename" placeholder="example.bin" value="data.bin"></label>

0A 00 01 02 FF FE FD"></textarea></label>

          <button class="btn secondary" id="btnLoadFileBin">📂 从文件加载</button>
          <button class="btn secondary" id="btnClearBin">清空</button>
        </div>
      </div>
    </div>
    <div class="tab-panel" id="panel-template">
      <div class="builder-form">
        <label>模板类型
          <select id="tplType">
            <option value="html">HTML5 页面</option>
            <option value="css">CSS 重置</option>
            <option value="js">ES6 模块</option>
            <option value="json">package.json</option>
            <option value="md">README.md</option>
            <option value="gitignore">.gitignore</option>
            <option value="dockerfile">Dockerfile</option>
            <option value="license">MIT License</option>

          <button class="btn secondary" id="btnPreviewTpl">👁 预览</button>
        </div>

    </div>
  </div>

      <input type="file" class="file-input" id="fileInput" multiple>
    </div>
    <div class="file-list" id="fileList"></div>
  </div>

      <div class="btn-row">

        <button class="btn secondary" id="btnClearRename">清除</button>
      </div>
    </div>
  </div>

  <div class="section">

      <button class="tab" data-tab="split">分割/合并</button>
      <button class="tab" data-tab="info">文件信息</button>
    </div>
    <div class="tab-panel active" id="panel-hash">
      <div class="drop-zone" id="hashDropZone" style="padding:20px;">
        <p>📂 拖拽文件计算哈希值</p>
        <input type="file" class="file-input" id="hashFileInput" multiple>
      </div>
      <div class="checksums" id="hashResults"></div>
    </div>
    <div class="tab-panel" id="panel-convert">
      <div class="builder-form">
        <label>源文件 <input type="file" id="convFileInput"></label>

    </div>
    <div class="tab-panel" id="panel-split">
      <div class="builder-form">
        <label>要分割的文件 <input type="file" id="splitFileInput"></label>

        <div class="btn-row">
          <button class="btn" id="btnSplit">✂️ 分割文件</button>
          <button class="btn secondary" id="btnMerge">🔗 合并文件</button>
        </div>
        <div id="splitResult"></div>
      </div>
    </div>
    <div class="tab-panel" id="panel-info">

        <input type="file" class="file-input" id="infoFileInput">
      </div>
      <div id="infoResult"></div>
    </div>
  </div>

  <div class="section">
    <h2>📋 支持的扩展名分类 (超长扩展名包含的所有格式)</h2>
    <div id="extCategories"></div>
  </div>
</div>

      <button class="preview-close" id="previewClose" aria-label="关闭">✕</button>

    <div class="preview-content" id="previewContent"></div>
  </div>
</div>

  const cleaned = str.replace(/[^0-9a-fA-F]/g, '');
  if (cleaned.length % 2 !== 0) throw new Error('十六进制长度必须为偶数');
  const arr = new Uint8Array(cleaned.length / 2);
  for (let i = 0; i < cleaned.length; i += 2) arr[i/2] = parseInt(cleaned.slice(i, i+2), 16);
  return arr;
}

  toast(`已生成 ${name}`);
};
$('#btnPreviewTpl').onclick = () => {
  const type = $('#tplType').value;
  openPreview('template.' + EXT_MAP[type], new TextEncoder().encode(TEMPLATES[type]));
});

// ============ 核心：MIME/格式检测 ============
function detectFormat(bytes, filename = '') {
  const ext = filename.split('.').pop().toLowerCase();
  const info = EXT_INFO[ext] || {};
  
  const magic = detectByMagic(bytes);
  if (magic) return { ...magic, source: 'magic' };
  
  if (info.mime) return { mime: info.mime, name: info.name, icon: info.icon, cat: info.cat, ext, source: 'extension' };
  
  if (isTextFile(bytes, ext)) return { mime: 'text/plain', name: '文本文件', icon: '📄', cat: '文档', ext: 'txt', source: 'text-detection' };
  
  return { mime: 'application/octet-stream', name: '未知二进制', icon: '📎', cat: '其他', ext: 'bin', source: 'fallback' };
}

function detectByMagic(bytes) {
  if (bytes.length < 4) return null;
  
  const hx = (b) => b.toString(16).padStart(2, '0');
  const h = hx(bytes[0]) + hx(bytes[1]) + hx(bytes[2]) + hx(bytes[3]);
  const h8 = h + hx(bytes[4]) + hx(bytes[5]) + hx(bytes[6]) + hx(bytes[7]);
  const h12 = h8 + hx(bytes[8]) + hx(bytes[9]) + hx(bytes[10]) + hx(bytes[11]);
  
  // 图像
  if (h.startsWith('89504e47')) return { mime: 'image/png', name: 'PNG 图片', icon: '🖼', cat: '图像', ext: 'png' };
  if (h.startsWith('ffd8ff')) return { mime: 'image/jpeg', name: 'JPEG 图片', icon: '🖼', cat: '图像', ext: 'jpg' };
  if (h.startsWith('47494638')) return { mime: 'image/gif', name: 'GIF 图片', icon: '🖼', cat: '图像', ext: 'gif' };
  if (h.startsWith('52494646') && bytes[8] === 0x57 && bytes[9] === 0x45 && bytes[10] === 0x42 && bytes[11] === 0x50) return { mime: 'image/webp', name: 'WebP 图片', icon: '🖼', cat: '图像', ext: 'webp' };
  if (h.startsWith('0000000c6a502020')) return { mime: 'image/jp2', name: 'JPEG 2000', icon: '🖼', cat: '图像', ext: 'jp2' };
  if (h.startsWith('424d')) return { mime: 'image/bmp', name: 'BMP 位图', icon: '🖼', cat: '图像', ext: 'bmp' };
  if (h.startsWith('49492a00') || h.startsWith('4d4d002a')) return { mime: 'image/tiff', name: 'TIFF 图片', icon: '🖼', cat: '图像', ext: 'tif' };
  if (h.startsWith('3c3f786d6c') || h.startsWith('3c737667')) return { mime: 'image/svg+xml', name: 'SVG 矢量图', icon: '🖼', cat: '图像', ext: 'svg' };
  if (h8.startsWith('52494646') && (h12.includes('41564920') || h12.includes('41564958'))) return { mime: 'video/avi', name: 'AVI 视频', icon: '🎬', cat: '视频', ext: 'avi' };
  if (h.startsWith('464f524d')) return { mime: 'image/x-iff', name: 'IFF 图片', icon: '🖼', cat: '图像', ext: 'iff' };
  
  // 视频
  if (h.startsWith('000000') && (bytes[4] === 0x66 || bytes[4] === 0x6d)) return { mime: 'video/mp4', name: 'MP4 视频', icon: '🎬', cat: '视频', ext: 'mp4' };
  if (h.startsWith('52494646') && h12.includes('41564920')) return { mime: 'video/x-msvideo', name: 'AVI 视频', icon: '🎬', cat: '视频', ext: 'avi' };
  if (h.startsWith('6d6f6f76') || h.startsWith('6d646174') || h8.startsWith('0000006d')) return { mime: 'video/quicktime', name: 'MOV 视频', icon: '🎬', cat: '视频', ext: 'mov' };
  if (h.startsWith('3026b2758e66cf11')) return { mime: 'video/x-ms-wmv', name: 'WMV 视频', icon: '🎬', cat: '视频', ext: 'wmv' };
  if (h.startsWith('464c5601')) return { mime: 'video/x-flv', name: 'FLV 视频', icon: '🎬', cat: '视频', ext: 'flv' };
  if (h.startsWith('1a45dfa3')) return { mime: 'video/x-matroska', name: 'MKV/WebM 视频', icon: '🎬', cat: '视频', ext: 'mkv' };
  if (h.startsWith('000001ba') || h.startsWith('000001b3')) return { mime: 'video/mpeg', name: 'MPEG 视频', icon: '🎬', cat: '视频', ext: 'mpg' };
  if (h.startsWith('2e524d46')) return { mime: 'application/vnd.rn-realmedia', name: 'RMVB 视频', icon: '🎬', cat: '视频', ext: 'rmvb' };
  if (h.startsWith('000000') && bytes.length>12 && bytes[4]===0x66 && bytes[5]===0x74 && bytes[6]===0x79 && bytes[7]===0x70) {
    const brand = new TextDecoder().decode(bytes.slice(8, 12));
    if (brand === '3gp' || brand.startsWith('3g')) return { mime: 'video/3gpp', name: '3GP 视频', icon: '🎬', cat: '视频', ext: '3gp' };
    if (brand === 'M4V ' || brand === 'm4v ') return { mime: 'video/x-m4v', name: 'M4V 视频', icon: '🎬', cat: '视频', ext: 'm4v' };
    if (brand === 'M4A ' || brand === 'm4a ') return { mime: 'audio/mp4', name: 'M4A 音频', icon: '🎵', cat: '音频', ext: 'm4a' };
  }
  if (h.startsWith('1a45dfa3') && bytes.length>8) {
    const docType = new TextDecoder().decode(bytes.slice(0, Math.min(64, bytes.length)));
    if (docType.includes('webm')) return { mime: 'video/webm', name: 'WebM 视频', icon: '🎬', cat: '视频', ext: 'webm' };
  }

  // 音频
  if (h.startsWith('fffb') || h.startsWith('fff3') || h.startsWith('fff2') || h.startsWith('ffe3')) return { mime: 'audio/mpeg', name: 'MP3 音频', icon: '🎵', cat: '音频', ext: 'mp3' };
  if (bytes[0]===0x49 && bytes[1]===0x44 && bytes[2]===0x33) return { mime: 'audio/mpeg', name: 'MP3 音频 (ID3)', icon: '🎵', cat: '音频', ext: 'mp3' };
  if (h.startsWith('52494646') && bytes.length>=12 && bytes[8]===0x57 && bytes[9]===0x41 && bytes[10]===0x56 && bytes[11]===0x45) return { mime: 'audio/wav', name: 'WAV 音频', icon: '🎵', cat: '音频', ext: 'wav' };
  if (h.startsWith('664c6143')) return { mime: 'audio/flac', name: 'FLAC 无损', icon: '🎵', cat: '音频', ext: 'flac' };
  if (h.startsWith('4f676753')) return { mime: 'audio/ogg', name: 'OGG 音频', icon: '🎵', cat: '音频', ext: 'ogg' };
  if (h.startsWith('4d546864')) return { mime: 'audio/midi', name: 'MIDI 音乐', icon: '🎵', cat: '音频', ext: 'mid' };
  if (h.startsWith('2321414d')) return { mime: 'audio/amr', name: 'AMR 音频', icon: '🎵', cat: '音频', ext: 'amr' };
  if (h.startsWith('464f524d') && bytes.length>=12 && bytes[8]===0x41 && bytes[9]===0x49 && bytes[10]===0x46 && bytes[11]===0x46) return { mime: 'audio/aiff', name: 'AIFF 音频', icon: '🎵', cat: '音频', ext: 'aiff' };
  if (h8.startsWith('3026b2758e66cf11')) return { mime: 'audio/x-ms-wma', name: 'WMA 音频', icon: '🎵', cat: '音频', ext: 'wma' };

  // 压缩包/归档
  if (h.startsWith('504b0304')) return { mime: 'application/zip', name: 'ZIP 压缩包', icon: '📦', cat: '压缩包', ext: 'zip' };
  if (h.startsWith('504b0506')) return { mime: 'application/zip', name: 'ZIP 压缩包', icon: '📦', cat: '压缩包', ext: 'zip' };
  if (h.startsWith('377abcaf271c')) return { mime: 'application/x-7z-compressed', name: '7Z 压缩包', icon: '📦', cat: '压缩包', ext: '7z' };
  if (h.startsWith('526172211a07')) return { mime: 'application/x-rar-compressed', name: 'RAR 压缩包', icon: '📦', cat: '压缩包', ext: 'rar' };
  if (h.startsWith('1f8b')) return { mime: 'application/gzip', name: 'GZIP 压缩', icon: '📦', cat: '压缩包', ext: 'gz' };
  if (h.startsWith('425a68')) return { mime: 'application/x-bzip2', name: 'BZIP2 压缩', icon: '📦', cat: '压缩包', ext: 'bz2' };
  if (h.startsWith('fd377a585a')) return { mime: 'application/x-xz', name: 'XZ 压缩', icon: '📦', cat: '压缩包', ext: 'xz' };
  if (h.startsWith('4d534346')) return { mime: 'application/vnd.ms-cab-compressed', name: 'CAB 压缩包', icon: '📦', cat: '压缩包', ext: 'cab' };
  if (h.startsWith('213c617263683e0a')) return { mime: 'application/x-debian-package', name: 'DEB 包', icon: '📦', cat: '压缩包', ext: 'deb' };
  if (h.startsWith('edabeedb')) return { mime: 'application/x-rpm', name: 'RPM 包', icon: '📦', cat: '压缩包', ext: 'rpm' };
  if (h.startsWith('1f9d') || h.startsWith('1fa0')) return { mime: 'application/x-compress', name: 'LZ 压缩', icon: '📦', cat: '压缩包', ext: 'lz' };
  if (bytes.length>=265 && bytes[257]===0x75 && bytes[258]===0x73 && bytes[259]===0x74 && bytes[260]===0x61 && bytes[261]===0x72) return { mime: 'application/x-tar', name: 'TAR 归档', icon: '📦', cat: '压缩包', ext: 'tar' };

  // 文档
  if (h.startsWith('255044462d')) return { mime: 'application/pdf', name: 'PDF 文档', icon: '📕', cat: '文档', ext: 'pdf' };
  if (h.startsWith('7b5c7274')) return { mime: 'application/rtf', name: 'RTF 富文本', icon: '📄', cat: '文档', ext: 'rtf' };
  if (h8.startsWith('d0cf11e0a1b11ae1')) return { mime: 'application/msword', name: 'Office 文档 (DOC/XLS/PPT)', icon: '📄', cat: '文档', ext: 'doc' };

  // 3D 模型
  if (h.startsWith('676c5446')) return { mime: 'model/gltf-binary', name: 'GLB 3D模型', icon: '🎲', cat: '3D模型', ext: 'glb' };
  if (h.startsWith('706c79')) return { mime: 'model/ply', name: 'PLY 点云', icon: '🎲', cat: '3D模型', ext: 'ply' };

  // 字体
  if (h.startsWith('00010000')) return { mime: 'font/ttf', name: 'TrueType 字体', icon: '🔤', cat: '其他', ext: 'ttf' };
  if (h.startsWith('4f54544f')) return { mime: 'font/otf', name: 'OpenType 字体', icon: '🔤', cat: '其他', ext: 'otf' };
  if (h.startsWith('774f4646')) return { mime: 'font/woff', name: 'WOFF 字体', icon: '🔤', cat: '其他', ext: 'woff' };
  if (h.startsWith('774f4632')) return { mime: 'font/woff2', name: 'WOFF2 字体', icon: '🔤', cat: '其他', ext: 'woff2' };

  // 可执行文件/其他
  if (h.startsWith('4d5a')) return { mime: 'application/x-msdownload', name: 'EXE/DLL 可执行', icon: '⚙️', cat: '其他', ext: 'exe' };
  if (h.startsWith('7f454c46')) return { mime: 'application/x-elf', name: 'ELF 可执行', icon: '⚙️', cat: '其他', ext: 'elf' };
  if (h.startsWith('cafebabe') || h.startsWith('cafed00d') || h.startsWith('feedface') || h.startsWith('feedfacf')) return { mime: 'application/x-mach-o', name: 'Mach-O 可执行', icon: '⚙️', cat: '其他', ext: 'macho' };
  if (h.startsWith('64383a616e6e6f756e6365')) return { mime: 'application/x-bittorrent', name: 'BitTorrent 种子', icon: '📎', cat: '其他', ext: 'torrent' };

  return null;
}

function isTextFile(bytes, ext) {
  // BOM 检测
  if (bytes.length>=3 && bytes[0]===0xEF && bytes[1]===0xBB && bytes[2]===0xBF) return true;
  if (bytes.length>=2 && bytes[0]===0xFF && bytes[1]===0xFE) return true;
  if (bytes.length>=2 && bytes[0]===0xFE && bytes[1]===0xFF) return true;
  // 已知文本扩展名
  const textExts = new Set(['txt','md','csv','json','yaml','yml','toml','xml','html','htm','css','js','mjs','cjs','ts','tsx','jsx','py','rb','php','java','c','cpp','h','hpp','cs','go','rs','swift','kt','scala','pl','lua','dart','jl','hs','ex','sh','bat','sql','r','m','mm','cfg','ini','conf','log','env','gitignore','dockerfile','makefile','cmake','tex','bib','rst','org','svg','gltf','obj','mtl']);
  if (textExts.has(ext)) return true;
  // 扫描前 512 字节，有 null 字节则为二进制
  const sample = bytes.slice(0, Math.min(512, bytes.length));
  for (let i = 0; i < sample.length; i++) {
    if (sample[i] === 0) return false;
  }
  let printable = 0;
  for (let i = 0; i < sample.length; i++) {
    const b = sample[i];
    if ((b >= 32 && b <= 126) || b === 9 || b === 10 || b === 13) printable++;
  }
  return printable / sample.length > 0.85;
}

function buildHexPreview(bytes) {
  const maxBytes = Math.min(bytes.length, 65536);
  let html = '';
  for (let i = 0; i < maxBytes; i += 16) {
    const addr = i.toString(16).padStart(8, '0').toUpperCase();
    let hexPart = '', asciiPart = '';
    for (let j = 0; j < 16; j++) {
      if (i + j < maxBytes) {
        const b = bytes[i + j];
        hexPart += b.toString(16).padStart(2, '0').toUpperCase() + ' ';
        asciiPart += (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.';
      } else {
        hexPart += '   ';
        asciiPart += ' ';
      }
    }
    html += '<div class="hex-line"><span class="hex-addr">' + addr + '</span><span class="hex-bytes">' + hexPart + '</span><span class="hex-ascii">' + asciiPart + '</span></div>';
  }
  if (bytes.length > maxBytes) html += '<div style="color:var(--muted);margin-top:8px;">... 仅显示前 ' + fmtBytes(maxBytes) + '，总大小 ' + fmtBytes(bytes.length) + '</div>';
  return html;
}

// ============ 核心：预览弹窗 ============
let currentPreviewFile = null;

function openPreview(filename, bytes) {
  const info = detectFormat(bytes, filename);
  const modal = $('#previewModal');
  const content = $('#previewContent');
  const title = $('#previewTitle');
  const detected = $('#previewDetected');

  title.textContent = filename;
  detected.style.display = 'flex';
  detected.innerHTML = info.icon + ' ' + info.name + ' <span style="color:var(--muted);font-size:0.7rem;">(' + info.mime + ')</span> 检测: ' + (info.source==='magic'?'魔数':info.source==='extension'?'扩展名':'文本检测');

  const mime = info.mime;
  const blob = new Blob([bytes], { type: mime });
  const url = URL.createObjectURL(blob);
  content.innerHTML = '';

  if (mime.startsWith('image/') && mime !== 'image/svg+xml') {
    const img = document.createElement('img');
    img.src = url;
    img.onload = function() { URL.revokeObjectURL(url); };
    img.onerror = function() { content.innerHTML = '<p style="color:var(--muted);text-align:center;">无法预览此图片格式</p>' + buildHexPreview(bytes); URL.revokeObjectURL(url); };
    content.appendChild(img);
  } else if (mime === 'image/svg+xml') {
    const txt = new TextDecoder().decode(bytes);
    content.innerHTML = '<pre>' + escapeHtml(txt) + '</pre><div style="text-align:center;margin-top:12px;"><div style="display:inline-block;max-width:100%;">' + txt + '</div></div>';
    URL.revokeObjectURL(url);
  } else if (mime.startsWith('video/')) {
    const video = document.createElement('video');
    video.src = url;
    video.controls = true;
    video.style.width = '100%';
    video.style.maxHeight = '70vh';
    video.onloadedmetadata = function() { URL.revokeObjectURL(url); };
    video.onerror = function() { content.innerHTML = '<p style="color:var(--muted);text-align:center;">无法预览此视频格式</p>' + buildHexPreview(bytes); URL.revokeObjectURL(url); };
    content.appendChild(video);
  } else if (mime.startsWith('audio/')) {
    const audio = document.createElement('audio');
    audio.src = url;
    audio.controls = true;
    audio.style.width = '100%';
    audio.onloadedmetadata = function() { URL.revokeObjectURL(url); };
    audio.onerror = function() { content.innerHTML = '<p style="color:var(--muted);text-align:center;">无法预览此音频格式</p>' + buildHexPreview(bytes); URL.revokeObjectURL(url); };
    const div = document.createElement('div');
    div.style.cssText = 'text-align:center;padding:40px;';
    div.innerHTML = '<div style="font-size:3rem;margin-bottom:16px;">' + info.icon + '</div>';
    div.appendChild(audio);
    content.appendChild(div);
  } else if (mime === 'application/pdf') {
    const embed = document.createElement('embed');
    embed.src = url;
    embed.type = 'application/pdf';
    embed.style.cssText = 'width:100%;height:70vh;';
    embed.onerror = function() { content.innerHTML = '<p style="color:var(--muted);text-align:center;">无法预览PDF，请下载后查看</p>' + buildHexPreview(bytes); URL.revokeObjectURL(url); };
    content.appendChild(embed);
  } else if (mime.startsWith('font/')) {
    content.innerHTML = '<div style="text-align:center;padding:20px;"><div style="font-size:3rem;margin-bottom:16px;">' + info.icon + '</div><p style="font-size:2rem;font-family:CustomFont,serif;">@font-face 预览</p></div>';
    const style = document.createElement('style');
    style.textContent = '@font-face { font-family: "CustomFont"; src: url(' + url + '); }';
    document.head.appendChild(style);
    setTimeout(function() { document.head.removeChild(style); URL.revokeObjectURL(url); }, 5000);
  } else if (mime.startsWith('model/')) {
    content.innerHTML = '<div style="text-align:center;padding:40px;"><div style="font-size:3rem;margin-bottom:16px;">' + info.icon + '</div><p style="color:var(--muted);">3D模型预览需要专用工具</p><p style="color:var(--muted);font-size:0.85rem;margin-top:8px;">文件大小: ' + fmtBytes(bytes.length) + '</p></div>' + buildHexPreview(bytes);
    URL.revokeObjectURL(url);
  } else if (mime.startsWith('text/') || mime === 'application/json' || mime === 'application/xml' || mime === 'application/yaml' || mime === 'application/toml') {
    const txt = new TextDecoder().decode(bytes);
    content.innerHTML = '<pre>' + escapeHtml(txt) + '</pre>';
    URL.revokeObjectURL(url);
  } else {
    // 二进制：十六进制预览
    content.innerHTML = buildHexPreview(bytes);
    URL.revokeObjectURL(url);
  }

  modal.classList.add('open');
  currentPreviewFile = { filename: filename, bytes: bytes };
}

$('#previewClose').onclick = function() { $('#previewModal').classList.remove('open'); currentPreviewFile = null; };
$('#previewModal').onclick = function(e) { if (e.target === $('#previewModal')) { $('#previewModal').classList.remove('open'); currentPreviewFile = null; } };

// ============ 文件拖拽上传 ============
const uploadedFiles = new Map();
let fileIdCounter = 0;

function setupDropZone(dropZoneEl, fileInputEl, onFiles) {
  dropZoneEl.addEventListener('click', function() { fileInputEl.click(); });
  dropZoneEl.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); dropZoneEl.classList.add('drag-over'); });
  dropZoneEl.addEventListener('dragleave', function(e) { e.preventDefault(); e.stopPropagation(); dropZoneEl.classList.remove('drag-over'); });
  dropZoneEl.addEventListener('drop', function(e) {
    e.preventDefault(); e.stopPropagation();
    dropZoneEl.classList.remove('drag-over');
    if (e.dataTransfer.files.length > 0) onFiles(e.dataTransfer.files);
  });
  fileInputEl.addEventListener('change', function(e) {
    if (e.target.files.length > 0) onFiles(e.target.files);
    e.target.value = '';
  });
}

function handleFiles(files) {
  Array.from(files).forEach(function(file) {
    const id = ++fileIdCounter;
    file.arrayBuffer().then(function(buf) {
      const bytes = new Uint8Array(buf);
      const info = detectFormat(bytes, file.name);
      const fileObj = { id: id, file: file, bytes: bytes, info: info };
      uploadedFiles.set(id, fileObj);
      renderFileItem(fileObj);
    });
  });
}

function renderFileItem(f) {
  const container = $('#fileList');
  const div = document.createElement('div');
  div.className = 'file-item';
  div.id = 'file-item-' + f.id;
  div.innerHTML =
    '<div class="file-icon">' + f.info.icon + '</div>' +
    '<div class="file-info">' +
      '<div class="file-name">' + escapeHtml(f.file.name) + '</div>' +
      '<div class="file-meta">' + fmtBytes(f.file.size) + ' · ' + (f.file.type || '未知类型') + ' · ' + new Date(f.file.lastModified).toLocaleString('zh-CN') + '</div>' +
      '<div class="file-detected">' + f.info.icon + ' ' + f.info.name + ' (' + f.info.mime + ') · 检测: ' + (f.info.source==='magic'?'魔数':f.info.source==='extension'?'扩展名':'文本') + '</div>' +
    '</div>' +
    '<div class="file-actions">' +
      '<button class="btn" data-action="preview" data-id="' + f.id + '">👁 预览</button>' +
      '<button class="btn secondary" data-action="download" data-id="' + f.id + '">📥 下载</button>' +
      '<button class="btn secondary" data-action="rename" data-id="' + f.id + '">🔄 重命名</button>' +
      '<button class="btn danger" data-action="remove" data-id="' + f.id + '">✕</button>' +
    '</div>';

  div.querySelector('[data-action="preview"]').onclick = function() { openPreview(f.file.name, f.bytes); };
  div.querySelector('[data-action="download"]').onclick = function() { downloadBlob(new Blob([f.bytes], { type: f.info.mime }), f.file.name); };
  div.querySelector('[data-action="rename"]').onclick = function() { setupRenameFile(f); };
  div.querySelector('[data-action="remove"]').onclick = function() { uploadedFiles.delete(f.id); div.remove(); };

  container.appendChild(div);
}

// ============ 重命名功能 ============
let renameFileObj = null;

function setupRenameFile(f) {
  renameFileObj = f;

  section.style.display = 'block';
  $('#renamePreview').style.display = 'block';

  $('#renameOriginalName').textContent = f.file.name;
  $('#renameDetected').innerHTML = f.info.icon + ' ' + f.info.name + ' (' + f.info.mime + ')';
  const longExt = '.' + f.info.ext + EXTENSION;
  $('#longExtPreview').textContent = f.file.name.replace(/\.[^.]+$/, '') + longExt;
  section.scrollIntoView({ behavior: 'smooth' });
}

setupDropZone($('#renameDropZone'), $('#renameFileInput'), function(files) {
  if (files.length === 0) return;
  const file = files[0];
  file.arrayBuffer().then(function(buf) {
    const bytes = new Uint8Array(buf);
    const info = detectFormat(bytes, file.name);
    renameFileObj = { id: ++fileIdCounter, file: file, bytes: bytes, info: info };
    const section = $('#renameSection');
    section.style.display = 'block';
    $('#renamePreview').style.display = 'block';

    $('#renameOriginalName').textContent = file.name;

    const longExt = '.' + info.ext + EXTENSION;

    section.scrollIntoView({ behavior: 'smooth' });
  });
});

$('#btnDownloadRenamed').onclick = function() {
  if (!renameFileObj) { toast('请先上传文件', 'warning'); return; }
  const info = renameFileObj.info;
  const longExt = '.' + info.ext + EXTENSION;
  const newName = renameFileObj.file.name.replace(/\.[^.]+$/, '') + longExt;
  downloadBlob(new Blob([renameFileObj.bytes], { type: info.mime }), newName);
  toast('已下载: ' + newName.slice(0, 50) + '...', 'success');
};

$('#btnPreviewRenamed').onclick = function() {
  if (!renameFileObj) { toast('请先上传文件', 'warning'); return; }
  openPreview(renameFileObj.file.name, renameFileObj.bytes);
};

$('#btnClearRename').onclick = function() {
  renameFileObj = null;
  $('#renameSection').style.display = 'none';
  $('#renamePreview').style.display = 'none';

// ============ 工具箱：哈希校验 ============
async function computeHash(bytes, algo) {
  const buf = await crypto.subtle.digest(algo, bytes);
  return [...new Uint8Array(buf)].map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
}

setupDropZone($('#hashDropZone'), $('#hashFileInput'), async function(files) {
  const results = $('#hashResults');
  results.innerHTML = '<div style="text-align:center;color:var(--muted);padding:12px;">计算中...</div>';

  for (var i = 0; i < files.length; i++) {
    const file = files[i];
    const buf = await file.arrayBuffer();
    const bytes = new Uint8Array(buf);

    const [md5, sha1, sha256, sha512] = await Promise.all([
      computeHash(bytes, 'MD5'),
      computeHash(bytes, 'SHA-1'),
      computeHash(bytes, 'SHA-256'),
      computeHash(bytes, 'SHA-512')
    ]);

    const div = document.createElement('div');
    div.style.cssText = 'background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;';
    div.innerHTML =
      '<div style="font-weight:600;margin-bottom:8px;word-break:break-all;">' + escapeHtml(file.name) + ' <span style="color:var(--muted);font-weight:400;">(' + fmtBytes(file.size) + ')</span></div>' +
      '<div class="checksums">' +
        '<div class="checksum-item"><span>MD5</span><code>' + md5 + '</code></div>' +
        '<div class="checksum-item"><span>SHA-1</span><code>' + sha1 + '</code></div>' +
        '<div class="checksum-item"><span>SHA-256</span><code>' + sha256 + '</code></div>' +
        '<div class="checksum-item"><span>SHA-512</span><code style="font-size:0.7rem;">' + sha512 + '</code></div>' +
      '</div>';
    results.appendChild(div);
  }

  const loading = results.querySelector('div');
  if (loading && loading.textContent === '计算中...') loading.remove();
});

// ============ 工具箱：格式转换 ============
$('#btnConvert').onclick = async function() {
  const file = $('#convFileInput').files[0];
  if (!file) { toast('请先选择文件', 'warning'); return; }
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  const target = $('#convTarget').value;
  let result = '';

  try {
    switch (target) {
      case 'base64':
        result = btoa(String.fromCharCode.apply(null, bytes));
        break;
      case 'hex':
        result = formatHex(bytes);
        break;
      case 'text':
        result = new TextDecoder().decode(bytes);
        break;
      case 'dataurl': {
        const info = detectFormat(bytes, file.name);
        const b64 = btoa(String.fromCharCode.apply(null, bytes));
        result = 'data:' + info.mime + ';base64,' + b64;
        break;
      }
    }
    $('#convResult').value = result;
    toast('转换完成', 'success');
  } catch (e) {
    toast('转换失败: ' + e.message, 'error');
  }
};

$('#btnCopyConv').onclick = function() {
  const val = $('#convResult').value;
  if (!val) { toast('没有可复制的内容', 'warning'); return; }
  copyText(val);
};

// ============ 工具箱：分割/合并 ============
let splitChunks = [];
$('#btnSplit').onclick = async function() {
  const file = $('#splitFileInput').files[0];
  if (!file) { toast('请先选择文件', 'warning'); return; }
  const chunkSize = parseInt($('#splitSize').value) * 1024;
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  splitChunks = [];

  for (let i = 0; i < bytes.length; i += chunkSize) {
    const chunk = bytes.slice(i, Math.min(i + chunkSize, bytes.length));
    splitChunks.push(chunk);
  }

  for (let i = 0; i < splitChunks.length; i++) {
    downloadBlob(new Blob([splitChunks[i]]), file.name + '.part' + String(i + 1).padStart(3, '0'));
  }

  $('#splitResult').innerHTML = '<div style="color:var(--success);margin-top:12px;padding:12px;background:var(--bg);border-radius:6px;">已分割为 ' + splitChunks.length + ' 个分片，正在下载...</div>';
  toast('已分割为 ' + splitChunks.length + ' 个分片', 'success');
};

$('#btnMerge').onclick = function() {
  const input = document.createElement('input');
  input.type = 'file';
  input.multiple = true;
  input.onchange = async function(e) {
    const files = Array.from(e.target.files);
    if (files.length < 2) { toast('请至少选择2个文件进行合并', 'warning'); return; }

    files.sort(function(a, b) { return a.name.localeCompare(b.name); });

    const chunks = [];
    for (var i = 0; i < files.length; i++) {
      const buf = await files[i].arrayBuffer();
      chunks.push(new Uint8Array(buf));
    }

    const totalLen = chunks.reduce(function(s, c) { return s + c.length; }, 0);
    const merged = new Uint8Array(totalLen);
    let offset = 0;
    for (var i = 0; i < chunks.length; i++) {
      merged.set(chunks[i], offset);
      offset += chunks[i].length;
    }

    const baseName = files[0].name.replace(/\.part\d+$/i, '');
    downloadBlob(new Blob([merged]), 'merged_' + baseName);
    $('#splitResult').innerHTML = '<div style="color:var(--success);margin-top:12px;padding:12px;background:var(--bg);border-radius:6px;">已合并 ' + files.length + ' 个文件，总大小: ' + fmtBytes(totalLen) + '，正在下载...</div>';
    toast('已合并 ' + files.length + ' 个文件', 'success');
  };
  input.click();
};

      '<div class="checksums">' +

        '<div class="checksum-item"><span>检测格式</span><span>' + info.icon + ' ' + info.name + '</span></div>' +
        '<div class="checksum-item"><span>MIME 类型</span><span>' + info.mime + '</span></div>' +
        '<div class="checksum-item"><span>分类</span><span>' + info.cat + '</span></div>' +
        '<div class="checksum-item"><span>检测方式</span><span>' + (info.source==='magic'?'魔数检测':info.source==='extension'?'扩展名匹配':'文本检测') + '</span></div>' +

        '<div class="checksum-item"><span>原始类型</span><span>' + (file.type || '未知') + '</span></div>' +

    '</div>';
});
