      ${exts.map(e => `<span class="ext-tag">.${e}</span>`).join('')}

`).join('');

// ============ 标签页切换 ============
$$('.tab-bar').forEach(bar => {
  bar.addEventListener('click', e => {
    const tab = e.target.closest('.tab'); if (!tab) return;
    const panelId = tab.dataset.tab;
    $$('.tab', bar).forEach(t => t.classList.toggle('active', t === tab));
    $$('.tab-panel', bar.parentElement).forEach(p => p.classList.toggle('active', p.id === 'panel-' + panelId));
  });
});

// ============ 文本文件写入 ============
$('#btnDownloadText').onclick = () => {
  const name = $('#txtFilename').value.trim() || 'file.txt';
  const content = $('#txtContent').value;
  const encoding = $('#txtEncoding').value;
  let blob;
  if (encoding === 'utf-8') blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  else if (encoding === 'utf-16') blob = new Blob([content], { type: 'text/plain;charset=utf-16' });
  else { // GBK 近似用 utf-8，浏览器不直接支持 GBK 编码
    blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    toast('浏览器限制：GBK 将以 UTF-8 保存', 'warning');
  }
  downloadBlob(blob, name);
  toast(`已下载 ${name}`);
};
$('#btnPreviewText').onclick = () => openPreview($('#txtFilename').value || 'preview.txt', new TextEncoder().encode($('#txtContent').value));
$('#btnClearText').onclick = () => { $('#txtContent').value = ''; toast('已清空'); };

// ============ 二进制/十六进制写入 ============
function parseHexInput(str) {
  const cleaned = str.replace(/[^0-9a-fA-F]/g, '');
  if (cleaned.length % 2 !== 0) throw new Error('十六进制长度必须为偶数');
  const arr = new Uint8Array(cleaned.length / 2);
  for (let i = 0; i < cleaned.length; i += 2) arr[i/2] = parseInt(cleaned.slice(i, i+2), 16);
  return arr;
}
$('#btnDownloadBin').onclick = () => {
  try {
    const name = $('#binFilename').value.trim() || 'data.bin';
    const bytes = parseHexInput($('#binHexInput').value);
    downloadBlob(new Blob([bytes]), name);
    toast(`已下载 ${name} (${bytes.length} 字节)`);
  } catch (e) { toast('错误: ' + e.message, 'error'); }
};
$('#btnPreviewBin').onclick = () => {
  try { openPreview('hex-preview.bin', parseHexInput($('#binHexInput').value)); }
  catch (e) { toast('错误: ' + e.message, 'error'); }
};
$('#btnLoadFileBin').onclick = () => $('#binFileInputHidden').click();
$('#btnClearBin').onclick = () => { $('#binHexInput').value = ''; toast('已清空'); };

// 隐藏的文件输入用于加载二进制
const binFileInput = document.createElement('input');
binFileInput.type = 'file';
binFileInput.id = 'binFileInputHidden';
binFileInput.style.display = 'none';
binFileInput.onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  $('#binHexInput').value = formatHex(bytes);
  toast(`已加载 ${file.name} (${bytes.length} 字节)`);
};
document.body.appendChild(binFileInput);

function formatHex(bytes) {
  let out = '';
  for (let i = 0; i < bytes.length; i++) {
    out += bytes[i].toString(16).padStart(2, '0').toUpperCase();
    if ((i + 1) % 16 === 0) out += '\n';
    else if (i + 1 < bytes.length) out += ' ';
  }
  return out;
}

// ============ 模板生成 ============
$('#tplType').onchange = () => {
  const v = $('#tplType').value;
  $('#tplFilename').value = (v === 'gitignore' ? '.gitignore' : (v === 'license' ? 'LICENSE' : 'template.' + EXT_MAP[v]));

// ============ 拖拽上传与预览 ============
const dropZone = $('#dropZone');
const fileInput = $('#fileInput');
['dragenter','dragover'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('drag-over'); }));
['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('drag-over'); }));
dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
dropZone.onclick = () => fileInput.click();
fileInput.onchange = e => handleFiles(e.target.files);

function handleFiles(files) {
  if (!files.length) return;
  [...files].forEach(f => renderFileItem(f));
  fileInput.value = '';
}

function renderFileItem(file) {
  const list = $('#fileList');
  const item = document.createElement('div');
  item.className = 'file-item';
  const icon = getFileIcon(file.name, file.type);
  item.innerHTML = `
    <span class="file-icon">${icon}</span>
    <div class="file-info">
      <div class="file-name">${escapeHtml(file.name)}</div>
      <div class="file-meta">${fmtBytes(file.size)} · ${file.type || '未知类型'} · 最后修改: ${new Date(file.lastModified).toLocaleString()}</div>
    </div>
    <div class="file-actions">
      <button class="btn secondary btn-preview" data-name="${escapeHtml(file.name)}">👁 预览</button>
      <button class="btn secondary btn-download" data-name="${escapeHtml(file.name)}">📥 下载</button>
      <button class="btn secondary btn-hash" data-name="${escapeHtml(file.name)}">🔐 哈希</button>
      <button class="btn danger btn-remove">✕</button>
    </div>
  `;
  const blobUrl = URL.createObjectURL(file);
  item.querySelector('.btn-preview').onclick = () => openPreview(file.name, file);
  item.querySelector('.btn-download').onclick = () => downloadBlob(file.slice(), file.name);
  item.querySelector('.btn-hash').onclick = () => computeHash(file).then(h => { toast('哈希已计算，查看工具箱', 'success'); showHashResults(file.name, h); switchTab('hash'); });
  item.querySelector('.btn-remove').onclick = () => { URL.revokeObjectURL(blobUrl); item.remove(); };
  list.appendChild(item);
}

function getFileIcon(name, type) {
  const ext = name.split('.').pop().toLowerCase();
  if (type?.startsWith('image/')) return '🖼';
  if (type?.startsWith('video/')) return '🎬';
  if (type?.startsWith('audio/')) return '🎵';
  if (type?.startsWith('text/') || ['md','txt','json','js','ts','jsx','tsx','html','css','yaml','yml','toml','xml','csv','py','rs','go','java','cpp','c','h','php','rb','swift','kt','sh','bat','sql'].includes(ext)) return '📄';
  if (['zip','7z','rar','tar','gz','bz2','xz'].includes(ext)) return '📦';
  if (['pdf'].includes(ext)) return '📕';
  if (['exe','msi','apk','app','dmg'].includes(ext)) return '⚙️';
  return '📎';
}

// ============ 预览模态框 ============
const previewModal = $('#previewModal');
const previewTitle = $('#previewTitle');
const previewContent = $('#previewContent');
$('#previewClose').onclick = closePreview;
previewModal.onclick = e => { if (e.target === previewModal) closePreview(); };

function closePreview() { previewModal.classList.remove('open'); previewContent.innerHTML = ''; }

async function openPreview(name, source) {
  previewTitle.textContent = name;
  previewContent.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--muted);">加载中...</div>';
  previewModal.classList.add('open');

  let bytes;
  if (source instanceof File || source instanceof Blob) bytes = new Uint8Array(await source.arrayBuffer());
  else if (source instanceof Uint8Array) bytes = source;
  else bytes = new TextEncoder().encode(String(source));

  const ext = name.split('.').pop().toLowerCase();
  const type = detectMime(bytes, ext);

  try {
    if (type.startsWith('image/')) {
      const url = URL.createObjectURL(new Blob([bytes], { type }));
      previewContent.innerHTML = `<img src="${url}" alt="${escapeHtml(name)}" onload="URL.revokeObjectURL(this.src)">`;
    } else if (type.startsWith('video/')) {
      const url = URL.createObjectURL(new Blob([bytes], { type }));
      previewContent.innerHTML = `<video controls autoplay src="${url}"></video>`;
    } else if (type.startsWith('audio/')) {
      const url = URL.createObjectURL(new Blob([bytes], { type }));
      previewContent.innerHTML = `<audio controls autoplay src="${url}"></audio>`;
    } else if (type === 'application/pdf') {
      const url = URL.createObjectURL(new Blob([bytes], { type }));
      previewContent.innerHTML = `<iframe src="${url}" style="width:100%;height:70vh;border:none;"></iframe>`;
    } else if (isTextFile(bytes, ext)) {
      const text = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
      previewContent.innerHTML = `<pre>${escapeHtml(text)}</pre>`;
    } else {
      previewContent.innerHTML = renderHexDump(bytes);
    }
  } catch (e) {
    previewContent.innerHTML = `<pre style="color:var(--danger);">预览失败: ${e.message}</pre>`;
  }
}

function detectMime(bytes, ext) {
  // 简单的魔数检测
  if (bytes.length >= 4) {
    const h = bytes[0].toString(16) + bytes[1].toString(16) + bytes[2].toString(16) + bytes[3].toString(16);
    if (h.startsWith('89504e47')) return 'image/png';
    if (h.startsWith('ffd8ff')) return 'image/jpeg';
    if (h.startsWith('47494638')) return 'image/gif';
    if (h.startsWith('52494646') && bytes[8] === 0x57 && bytes[9] === 0x45) return 'image/webp';
    if (h.startsWith('000000') && (bytes[4] === 0x66 || bytes[4] === 0x6d)) return 'video/mp4';
    if (h.startsWith('25504446')) return 'application/pdf';
    if (h.startsWith('504b0304') || h.startsWith('504b0506') || h.startsWith('504b0708')) return 'application/zip';
    if (h.startsWith('377abcaf')) return 'application/x-7z-compressed';
    if (h.startsWith('52617221')) return 'application/x-rar';
  }
  const textExts = ['txt','md','json','js','ts','jsx','tsx','html','css','yaml','yml','toml','xml','csv','py','rs','go','java','cpp','c','h','php','rb','swift','kt','sh','bat','sql','log','ini','cfg','conf','properties'];
  if (textExts.includes(ext)) return 'text/plain';
  return 'application/octet-stream';
}

function isTextFile(bytes, ext) {
  const textExts = ['txt','md','json','js','ts','jsx','tsx','html','css','yaml','yml','toml','xml','csv','py','rs','go','java','cpp','c','h','php','rb','swift','kt','sh','bat','sql','log','ini','cfg','conf','properties'];
  if (textExts.includes(ext)) return true;
  // 检测是否包含大量非打印字符
  let nonPrint = 0;
  for (let i = 0; i < Math.min(bytes.length, 8192); i++) {
    const b = bytes[i];
    if (b !== 9 && b !== 10 && b !== 13 && (b < 32 || b > 126)) nonPrint++;
  }
  return nonPrint / Math.min(bytes.length, 8192) < 0.1;
}

function renderHexDump(bytes) {
  const lines = [];
  for (let i = 0; i < bytes.length; i += 16) {
    const chunk = bytes.slice(i, i + 16);
    const addr = i.toString(16).padStart(8, '0').toUpperCase();
    const hex = [...chunk].map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
    const ascii = [...chunk].map(b => (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.').join('');
    lines.push(`<div class="hex-line"><span class="hex-addr">${addr}</span><span class="hex-bytes">${hex}</span><span class="hex-ascii">${ascii}</span></div>`);
  }
  return `<div class="hex">${lines.join('')}</div>`;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'''}[c]));
}

// ============ 哈希计算 ============
async function computeHash(file) {
  const buf = await file.arrayBuffer();
  const [md5, sha1, sha256, sha512] = await Promise.all([
    crypto.subtle.digest('MD5', buf),
    crypto.subtle.digest('SHA-1', buf),
    crypto.subtle.digest('SHA-256', buf),
    crypto.subtle.digest('SHA-512', buf),
  ]);
  return { md5: toHex(md5), sha1: toHex(sha1), sha256: toHex(sha256), sha512: toHex(sha512) };
}
function toHex(buf) { return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join(''); }

function showHashResults(name, hashes) {
  $('#hashResults').innerHTML = `
    <div style="font-weight:600;margin-bottom:8px;">${escapeHtml(name)}</div>
    <div class="checksum-item"><span>MD5</span><code>${hashes.md5}</code></div>
    <div class="checksum-item"><span>SHA-1</span><code>${hashes.sha1}</code></div>
    <div class="checksum-item"><span>SHA-256</span><code>${hashes.sha256}</code></div>
    <div class="checksum-item"><span>SHA-512</span><code>${hashes.sha512}</code></div>
  `;
}

const hashDropZone = $('#hashDropZone');
const hashFileInput = $('#hashFileInput');
['dragenter','dragover'].forEach(ev => hashDropZone.addEventListener(ev, e => { e.preventDefault(); hashDropZone.classList.add('drag-over'); }));
['dragleave','drop'].forEach(ev => hashDropZone.addEventListener(ev, e => { e.preventDefault(); hashDropZone.classList.remove('drag-over'); }));
hashDropZone.addEventListener('drop', e => handleHashFiles(e.dataTransfer.files));
hashDropZone.onclick = () => hashFileInput.click();
hashFileInput.onchange = e => handleHashFiles(e.target.files);

async function handleHashFiles(files) {
  if (!files.length) return;
  for (const f of [...files]) {
    const h = await computeHash(f);
    showHashResults(f.name, h);
  }
  hashFileInput.value = '';
  toast(`已计算 ${files.length} 个文件哈希`, 'success');
}

// ============ 格式转换 ============
$('#convFileInput').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  const buf = await f.arrayBuffer();
  const bytes = new Uint8Array(buf);
  convertBytes(bytes, $('#convTarget').value);
  e.target.value = '';
};
$('#convTarget').onchange = () => {
  const f = $('#convFileInput').files[0];
  if (f) { f.arrayBuffer().then(buf => convertBytes(new Uint8Array(buf), $('#convTarget').value)); }
};
$('#btnConvert').onclick = () => $('#convFileInput').click();
$('#btnCopyConv').onclick = () => copyText($('#convResult').value);

function convertBytes(bytes, target) {
  let result = '';
  switch (target) {
    case 'base64': result = btoa(String.fromCharCode(...bytes)); break;
    case 'hex': result = formatHex(bytes); break;
    case 'text': result = new TextDecoder('utf-8', { fatal: false }).decode(bytes); break;
    case 'dataurl': {
      const mime = detectMime(bytes, '');
      result = `data:${mime};base64,${btoa(String.fromCharCode(...bytes))}`;
      break;
    }
  }
  $('#convResult').value = result;
  toast('转换完成');
}

// ============ 分割/合并 ============
$('#btnSplit').onclick = async () => {
  const f = $('#splitFileInput').files[0]; if (!f) { toast('请先选择文件', 'error'); return; }
  const sizeKB = parseInt($('#splitSize').value) * 1024;
  const buf = await f.arrayBuffer();
  const bytes = new Uint8Array(buf);
  const parts = Math.ceil(bytes.length / sizeKB);
  const baseName = f.name.replace(/\.[^.]+$/, '');
  for (let i = 0; i < parts; i++) {
    const start = i * sizeKB;
    const end = Math.min(start + sizeKB, bytes.length);
    const part = bytes.slice(start, end);
    downloadBlob(new Blob([part]), `${baseName}.part${String(i+1).padStart(3,'0')}`);
  }
  $('#splitResult').innerHTML = `<div style="color:var(--success);margin-top:8px;">已分割为 ${parts} 个文件，每个约 ${fmtBytes(sizeKB)}</div>`;
  toast(`分割完成: ${parts} 个文件`);
};

$('#btnMerge').onclick = async () => {
  const files = $('#splitFileInput').files; if (!files.length) { toast('请选择要合并的分片文件', 'error'); return; }
  const sorted = [...files].sort((a,b) => a.name.localeCompare(b.name));
  const chunks = [];
  for (const f of sorted) chunks.push(new Uint8Array(await f.arrayBuffer()));
  const totalLen = chunks.reduce((s, c) => s + c.length, 0);
  const merged = new Uint8Array(totalLen);
  let offset = 0;
  for (const c of chunks) { merged.set(c, offset); offset += c.length; }
  const baseName = sorted[0].name.replace(/\.part\d+$/, '');
  downloadBlob(new Blob([merged]), baseName + '_merged');
  $('#splitResult').innerHTML = `<div style="color:var(--success);margin-top:8px;">已合并 ${sorted.length} 个分片，总计 ${fmtBytes(totalLen)}</div>`;
  toast('合并完成');
};

// ============ 文件信息 ============
const infoDropZone = $('#infoDropZone');
const infoFileInput = $('#infoFileInput');
['dragenter','dragover'].forEach(ev => infoDropZone.addEventListener(ev, e => { e.preventDefault(); infoDropZone.classList.add('drag-over'); }));
['dragleave','drop'].forEach(ev => infoDropZone.addEventListener(ev, e => { e.preventDefault(); infoDropZone.classList.remove('drag-over'); }));
infoDropZone.addEventListener('drop', e => handleInfoFiles(e.dataTransfer.files));
infoDropZone.onclick = () => infoFileInput.click();
infoFileInput.onchange = e => handleInfoFiles(e.target.files);

async function handleInfoFiles(files) {
  if (!files.length) return;
  const f = files[0];
  const buf = await f.arrayBuffer();
  const bytes = new Uint8Array(buf);
  const ext = f.name.split('.').pop().toLowerCase();
  const mime = detectMime(bytes, ext);
  const hashes = await computeHash(f);
  $('#infoResult').innerHTML = `
    <div style="display:grid;gap:8px;font-family:ui-monospace,monospace;font-size:0.85rem;">
      <div><b>文件名:</b> ${escapeHtml(f.name)}</div>
      <div><b>大小:</b> ${fmtBytes(f.size)} (${f.size} 字节)</div>
      <div><b>类型:</b> ${f.type || mime}</div>
      <div><b>扩展名:</b> .${ext}</div>
      <div><b>最后修改:</b> ${new Date(f.lastModified).toLocaleString()}</div>
      <div><b>MIME 检测:</b> ${mime}</div>
      <div><b>是否文本:</b> ${isTextFile(bytes, ext) ? '是' : '否'}</div>
      <hr style="border-color:var(--border);margin:8px 0;">
      <div><b>MD5:</b> ${hashes.md5}</div>
      <div><b>SHA-1:</b> ${hashes.sha1}</div>
      <div><b>SHA-256:</b> ${hashes.sha256}</div>
      <div><b>SHA-512:</b> ${hashes.sha512}</div>
      <hr style="border-color:var(--border);margin:8px 0;">
      <div><b>文件头 (前32字节):</b></div>
      <div class="hex">${renderHexDump(bytes.slice(0, 32)).replace(/<div class="hex">|<\/div>/g, '')}</div>
    </div>
  `;
  infoFileInput.value = '';
}

function switchTab(name) {
  const tab = document.querySelector(`.tab[data-tab="${name}"]`);
  if (tab) tab.click();
}

// ============ 键盘快捷键 ============
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePreview();
});
</script>
